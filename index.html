<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Pilates</title>
  <link rel="icon" type="image/png" href="/assets/logo-clubpilates.png" />
  <style>
    :root {
      --primary-100: #d4eaf7;
      --primary-200: #b6ccd8;
      --primary-300: #3b3c3d;
      --accent-100: #71c4ef;
      --accent-200: #00668c;
      --text-100: #1d1c1c;
      --text-200: #313d44;
      --bg-100: #fffefb;
      --bg-200: #f5f4f1;
      --bg-300: #cccbc8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-100);
      color: var(--text-100);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px;
    }

    .logo {
      height: 140px;
      width: auto;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 24px 0 4px;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-200);
      font-size: 0.95rem;
      margin: 0 0 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    a.card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-200);
      border: 1px solid var(--bg-300);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    a.card:hover {
      border-color: var(--accent-100);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transform: translateY(-1px);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-100);
      color: var(--accent-200);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg { width: 22px; height: 22px; }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-100);
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-200);
      margin: 0;
    }

    footer {
      margin-top: 56px;
      font-size: 0.75rem;
      color: var(--bg-300);
    }

    @media (prefers-color-scheme: dark) {
      body { background: #14181b; color: #f0efec; }
      p.subtitle { color: #a9b2b6; }
      a.card { background: #1c2226; border-color: #2a3236; }
      .card-title { color: #f0efec; }
      .card-desc { color: #a9b2b6; }
      .card-icon { background: #202a2e; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/assets/logo-clubpilates.png" alt="Club Pilates" />
  <h1>Club Pilates</h1>
  <p class="subtitle">Accede a las herramientas del equipo</p>

  <div class="grid">
    <a class="card" href="https://analytics.clubpilatesia.es">
      <div class="card-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m6 10V11m-9 6h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      </div>
      <span class="card-title">Analytics</span>
      <p class="card-desc">Dashboard de KPIs por centro</p>
    </a>

    <a class="card" href="https://crm.clubpilatesia.es">
      <div class="card-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>
      <span class="card-title">CRM</span>
      <p class="card-desc">Contactos, llamadas y conversaciones</p>
    </a>
  </div>

  <footer>&copy; <span id="year"></span> Club Pilates</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
